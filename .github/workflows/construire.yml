# Construit l'application autonome (sans installation) pour Windows et macOS.
#
# Publier une nouvelle version :
#   1. mettre à jour __version__ dans simu_credit/__init__.py (ex. "0.2.0") et pousser ;
#   2. git tag v0.2.0 && git push origin v0.2.0
# GitHub lance alors les tests, construit les trois fichiers et publie la release avec eux.
#
# Sans étiquette (onglet Actions > « Run workflow »), les fichiers sont seulement construits
# et téléchargeables en bas de la page du « run » (rubrique Artifacts), sans release.
name: Construire l'application

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  construire:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nom: Windows
          - os: macos-latest
            nom: macOS-AppleSilicon
          - os: macos-15-intel
            nom: macOS-Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Version de l'étiquette = version du code
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          code=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' simu_credit/__init__.py)
          if [ "v$code" != "$GITHUB_REF_NAME" ]; then
            echo "::error::L'étiquette $GITHUB_REF_NAME ne correspond pas à __version__ = $code"
            exit 1
          fi
      - name: Dépendances
        run: uv sync --python 3.14
      - name: Tests (calculs et interface)
        run: uv run pytest -q
      - name: Construction
        run: uv run pyinstaller simu_credit.spec --noconfirm

      - name: Archive macOS
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/Simulateur de credit.app" "Simulateur-de-credit-${{ matrix.nom }}.zip"
      - name: Exécutable Windows
        if: runner.os == 'Windows'
        run: Move-Item dist/SimulateurCredit.exe "Simulateur-de-credit-Windows.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: Simulateur-de-credit-${{ matrix.nom }}
          path: Simulateur-de-credit-*

  publier:
    # Uniquement pour une étiquette de version, et seulement si les trois constructions ont réussi
    if: startsWith(github.ref, 'refs/tags/v')
    needs: construire
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: fichiers
          merge-multiple: true
      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l fichiers
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # Release déjà créée (relance du workflow) : on remplace les fichiers
            gh release upload "$GITHUB_REF_NAME" fichiers/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" fichiers/* \
              --verify-tag \
              --title "Simulateur de crédit ${GITHUB_REF_NAME#v}" \
              --notes-file .github/NOTES_RELEASE.md \
              --generate-notes
          fi
