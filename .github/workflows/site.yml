# Publie le site sur GitHub Pages à chaque modification de la branche main,
# seulement si tous les tests passent (calculs, exemples publiés, non-régression).
name: Site web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: npm test
      - name: Préparation du site
        run: |
          mkdir _site
          cp -r index.html style.css logo.svg js _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publier:
    # Les propositions de modification (pull requests) sont testées mais pas publiées
    if: github.event_name != 'pull_request'
    needs: verifier
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
