[project]
name = "simu-credit"
version = "0.1.0"
description = "Simulateur de crédit (consommation, auto, immobilier) avec interface graphique"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8"]

[project.scripts]
simu-credit = "simu_credit.gui:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
